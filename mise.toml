# Tools and tasks for development and CI (jdx/mise-action). Renovate updates
# the tool versions in its CI tools group.
[tools]
# ESPHome's dependencies don't ship wheels for newer Python versions yet;
# .github/renovate.jsonc keeps Python on 3.13.
python = "3.13.17"
uv = "0.13.5"
"pipx:esphome" = "2026.11.1"
yamllint = "1.38.0"
gitleaks = "8.30.1"
jactionlint = "2.3.0"
shellcheck = "0.11.0" # Used by jactionlint.
node = "26.13.0"
# @yarnpkg/libzip 3.2.2 was published by hand without the provenance
# attestation that 3.2.0 and 3.2.1 have, which mise's npm trust policy rejects.
# Its gitHead matches the upstream @yarnpkg/libzip/3.2.2 tag.
"npm:renovate" = { version = "44.222.4", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[settings]
pipx.uvx = true

[env]
# Override to test against another ESPHome release, e.g.
# ESPHOME_CMD="uvx --prerelease=allow esphome" for the latest beta.
ESPHOME_CMD = "{{ get_env(name='ESPHOME_CMD', default='esphome') }}"

[tasks.setup]
description = "Install tools and the git pre-commit hook"
run = [
  "mise install",
  "mise generate git-pre-commit --write --task=pre-commit",
]

[tasks.check]
description = "Run every check except the firmware build"
depends = ["lint", "security/secrets", "test", "renovate/check"]

[tasks.pre-commit]
description = "Checks run by the git pre-commit hook"
depends = ["lint", "security/secrets", "test"]

[tasks.lint]
description = "Lint YAML and GitHub workflows"
depends = ["lint/yaml", "lint/actions"]

[tasks."lint/yaml"]
run = "yamllint --strict ."

[tasks."lint/actions"]
run = "jactionlint"

# Scans commits, not the directory: the ignored local/ folder holds real
# values that gitleaks dir would report.
[tasks."security/secrets"]
description = "Scan git history and staged changes for leaked secrets"
run = [
  "gitleaks git --no-banner --redact",
  "gitleaks git --no-banner --redact --pre-commit --staged",
]

[tasks.test]
description = "Validate the ESPHome test configurations"
depends = ["test/config"]

[tasks."test/config"]
usage = 'arg "[config]" var=#true help="Test configs (default: all in tests/)"'
run = '''
set -eu
configs="${usage_config:-$(ls tests/*.yaml | grep -v /secrets.yaml)}"
$ESPHOME_CMD config $configs > /dev/null
echo "Valid: $configs"
'''

[tasks."build/firmware"]
description = "Compile the ESPHome test configurations"
usage = 'arg "[config]" var=#true help="Test configs (default: all in tests/)"'
run = '''
set -eu
configs="${usage_config:-$(ls tests/*.yaml | grep -v /secrets.yaml)}"
$ESPHOME_CMD compile $configs
'''

[tasks."renovate/check"]
description = "Validate the Renovate config and check that it extracts dependencies"
run = "renovate --platform=local --dry-run=extract --require-config=required --config-validation-error=true --onboarding=false"
