name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly build against the latest ESPHome beta to catch breaking changes early.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history.
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [tests/esp32-c3.yaml, tests/esp32-debug.yaml]
        esphome: ${{ fromJSON(github.event_name == 'schedule' && '["pinned", "beta"]' || '["pinned"]') }}
    name: build (${{ matrix.config }}, ${{ matrix.esphome }})
    env:
      ESPHOME_CMD: ${{ matrix.esphome == 'beta' && 'uvx --prerelease=allow esphome' || 'esphome' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            tests/.esphome
          key: esphome-${{ matrix.esphome }}-${{ matrix.config }}-${{ hashFiles('mise.toml', 'packages/**') }}
          restore-keys: esphome-${{ matrix.esphome }}-${{ matrix.config }}-
      - run: mise run validate ${{ matrix.config }}
      - run: mise run build ${{ matrix.config }}
