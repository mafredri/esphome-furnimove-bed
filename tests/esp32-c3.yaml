# CI test: same layout as examples/bedroom-bed.yaml, but with local packages.
substitutions:
  name: test-esp32-c3
  friendly_name: Test Bed

packages:
  base: !include ../packages/base.yaml
  board: !include ../packages/boards/esp32-c3.yaml
  bluetooth_proxy: !include ../packages/bluetooth_proxy.yaml
  left_bed: !include
    file: ../packages/bed.yaml
    vars:
      device_name: Left
      device_id: left
      device_mac: !secret left_bed_mac
  right_bed: !include
    file: ../packages/bed.yaml
    vars:
      device_name: Right
      device_id: right
      device_mac: !secret right_bed_mac

api:
  encryption:
    key: !secret test_api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# CI runners have no local timezone to detect.
time:
  - id: !extend homeassistant_time
    timezone: UTC
